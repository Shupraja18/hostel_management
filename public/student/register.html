<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Registration | HostelCare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/auth.css">

</head>

<body>

<div class="auth-container">

  <div class="auth-card">

    <div class="auth-logo">
      <h1>HostelCare</h1>
      <p>Create your student account</p>
    </div>

    <div class="role-badge">🎓 Student Access</div>

    <h2>Student Registration</h2>

    <div
      id="errorMessage"
      class="error-message"
    ></div>

    <form id="registerForm">

      <div class="form-group">
        <label>Name</label>

        <input
          type="text"
          id="name"
          placeholder="Your full name"
          required
        >
      </div>

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >
      </div>

      <div class="form-group">
        <label>Room Number</label>

        <input
          type="text"
          id="room"
          placeholder="Example: B-402"
          required
        >
      </div>

      <div class="form-group">
        <label>Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="9876543210"
        >
      </div>

      <button
        type="submit"
        class="auth-button"
        id="registerButton"
      >
        Create Account
      </button>

    </form>

    <div class="auth-footer">

      Already have an account?

      <a href="/student/login.html">
        Login
      </a>

    </div>

    <a href="/" class="back-link">
      ← Back to Home
    </a>

  </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>

<script>

// Already logged in? Skip straight to the dashboard.
redirectLoggedInUser();

const form =
  document.getElementById('registerForm');

const errorMessage =
  document.getElementById('errorMessage');

const registerButton =
  document.getElementById('registerButton');

form.addEventListener('submit', async (e) => {

  e.preventDefault();

  errorMessage.style.display = 'none';

  registerButton.disabled = true;
  registerButton.textContent = 'Creating account...';

  try {

    const data = await apiFetch(
      '/auth/student/register',
      {
        method: 'POST',

        body: JSON.stringify({

          name:
            document.getElementById('name').value.trim(),

          email:
            document.getElementById('email').value.trim(),

          password:
            document.getElementById('password').value,

          room:
            document.getElementById('room').value.trim(),

          phone:
            document.getElementById('phone').value.trim()

        })
      }
    );

    saveAuth(data);

    showToast('Account created — welcome to HostelCare!', 'success');

    window.location.href =
      '/student/dashboard.html';

  } catch (error) {

    errorMessage.textContent =
      error.message;

    errorMessage.style.display = 'block';

  } finally {

    registerButton.disabled = false;
    registerButton.textContent =
      'Create Account';

  }

});

</script>

</body>
</html>
